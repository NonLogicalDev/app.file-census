    priority: 94
    created_at: 2026-07-15T05:45:00Z

  - id: cli-scan-bootstrap
    work: Implement and prove compatible CLI scan bootstrap with canonical source validation, atomic location/scan creation, UTC date-based IDs, collisions, and legacy behavior.
    status: claimed
    prerequisites:
      - backend-domain-foundation
    priority: 88
    created_at: 2026-07-15T05:45:00Z
    claim:
      owner: root
      started_at: 2026-07-15T11:18:00Z
    outcome: Source implementation now validates source/offset before a one-transaction compatible-location bootstrap, UTC date-ID reservation with deterministic collisions, and scan insertion while preserving legacy CLI forms. Deterministic source tests cover mismatch, rollback, collision, and invalid setup. Toolchain-backed CLI/integration proof remains pending.

  - id: scanner-progress-tui
    work: Implement and prove opt-in Ratatui progress with bounded active-operation telemetry, truthful queue/pool bars, duration ordering, terminal restoration, and non-TTY fallback.
    status: claimed
    prerequisites:
      - backend-domain-foundation
    priority: 86
    created_at: 2026-07-15T05:45:00Z
    claim:
      owner: root
      started_at: 2026-07-15T11:27:00Z
    outcome: Bounded authoritative active-operation telemetry is now present in source with stable oldest-first projection and cleanup coverage. A read-only seam audit confirms `run_prepared_scan_cli` owns the local worker, event stream, progress store, and final summary; `--tui` should be limited to local scan runners, conflict with JSON, and fall back to plain output on non-TTY. The Ratatui/Crossterm dependency, renderer, and terminal acceptance remain intentionally unstarted until approved reproducible inputs are available.

  - id: scanner-containment-atomicity
    work: "Eliminate or explicitly constrain remaining scanner lifecycle risks: persistent runner-error finalization (P1), post-discovery filesystem replacement races (P2), and update-scan setup atomicity. Use a durable, reviewed design; do not claim final quality while any remains unresolved."
    status: claimed
    prerequisites:
      - backend-domain-foundation
    priority: 85
    created_at: 2026-07-15T09:27:00Z
    claim:
      owner: root
      started_at: 2026-07-15T12:59:00Z
    outcome: Update-scan setup is source-atomic for ordinary setup failures. The reviewed scanner repair now finalizes ordinary runner errors, preserves failed terminal events, atomically couples progress counts to cache invalidation, safely falls back to terminal status on a cache-delete-only failure, and bounds late file/directory replacement. Portable descriptor-relative no-follow traversal, crash/panic stale-run reconciliation, and toolchain-backed tests remain open.

  - id: browser-native-accessibility-matrix
    work: Prove browser-server, native/Tauri, keyboard/accessibility, destructive-fixture, and transport behavior on the rebuilt product.
    status: open
    prerequisites:
      - scan-exclude-filter-contract
      - duplicates-tasks-search-options
      - native-bundle-icon-assets
      - reproducible-build-inputs
      - scanner-containment-atomicity
    priority: 80
    outcome: In-app browser connectivity is available, but the current enterprise policy blocks the local preview origin. Do not substitute Chrome; browser evidence remains pending permitted local access and reproducible build inputs.
    created_at: 2026-07-15T05:45:00Z

