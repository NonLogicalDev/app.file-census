    evidence:
      - docs: AGENTS.md, GOALS.md, plan-065, plan-066, workqueue.yaml

  - id: visual-reference-recovery
    work: Recover or re-supply the deleted visual reference and approved prototype screenshots before any visual parity or final-acceptance claim.
    status: open
    prerequisites:
      - rebuild-requirements-ledger
    priority: 100
    created_at: 2026-07-15T05:45:00Z
    routing:
      assigned_to: user
    resources:
      - user-reference-asset

  - id: structured-source-recovery
    work: Extract the pre-deletion historical patch ledger, deduplicate copied calls, replay only exact context matches into a temporary tree, and promote only validated source into this checkout.
    status: succeeded
    prerequisites:
      - rebuild-requirements-ledger
    priority: 100
    created_at: 2026-07-15T05:55:00Z
    resources:
      - session-logs
    outcome: Direct-event manifest plus a hash-verified source index are complete. Path-scoped recovery gates every patch on direct success output; complete-read seeds now validate strict multi-line overlaps. A final-architecture baseline is promoted with static import/module checks, a latest clean dark global-style horizon through 2026-07-12, a June 14 App source whose 47-file import closure resolves, a 1,385-line scanner horizon, and exact root flake/ignore blobs. The strict replay boundary documented incompatible database/CLI horizons rather than fabricating them; their intentional reconstruction belongs to downstream domain work. The historical plan archive contains 41 exact-replayed, hash-verified files and records 25 non-fabricated omissions. A final index audit found no remaining canonical source/config/test artifact that is both absent and deterministically recoverable; keep the conflicting cli.rs horizons unmerged. Static UI imports close, but missing toolchains/lockfiles and UI dist keep runtime validation blocked.

  - id: native-bundle-icon-assets
    work: Recover the configured macOS native bundle icon assets from an approved installed File Census bundle, without changing that installed application.
    status: succeeded
    prerequisites:
      - rebuild-requirements-ledger
    priority: 97
    created_at: 2026-07-15T08:38:00Z
    outcome: Exact ICNS and configured PNG sizes are present under src/native_app/icons; no installed-app files were modified.
    evidence:
      - source: /Applications/file-census.app/Contents/Resources/icon.icns
      - sha256: 32d3f29f5a3e39595149ff50172db18a53e866ab8d6a83be480be4e5514fdd6e
      - config: src/native_app/tauri.conf.json

  - id: reproducible-build-inputs
    work: Establish approved, canonical Nix/npm/Cargo inputs and bounded artifact paths before the first end-to-end build proof.
    status: open
    prerequisites:
      - structured-source-recovery
      - native-bundle-icon-assets
    priority: 96
    created_at: 2026-07-15T08:45:00Z
    outcome: Exact PostCSS and Tailwind source configs are restored, and root Justfile recipes now enter the declared Nix shell for both frontend and Rust commands. A fresh read-only audit confirms the host has only nix/just, ui/dist is empty, ui/node_modules has no usable Vite/Tauri executables, no canonical frontend lockfile exists, target contains no backend/native executable or app, and full Xcode is not selected. An external untracked Cargo.lock and working-tree flake.lock remain unproven; preserve them without staging and verify their provenance under explicit build-input approval. This work needs explicit approval before network or high-disk writes.
    resources:
      - user-approval-for-network-and-build-artifacts

  - id: backend-domain-foundation
    work: Build the Rust/SQLite domain and JSON-RPC/browser-server foundation for locations, scans, files, scan visibility, and live progress.
    status: claimed
    prerequisites:
      - rebuild-requirements-ledger
      - structured-source-recovery
    priority: 99
    created_at: 2026-07-15T05:45:00Z
    claim:
      owner: root
      started_at: 2026-07-15T08:41:00Z
    outcome: The database now supplies snapshot-scoped tree/search/occurrence pages, protected visible deletion, duplicate-cache status, update-scan seed/create support, a legacy-safe Unknown location-kind migration, scan-aware folder authorization, and one DB-level visible action resolver for open/reveal. Thumbnail batches reauthorize each candidate and browser/native source tests now assert equivalent visible-offset and excluded-path behavior. Browser/native details use visible media sources and WebSocket lag is recoverable. Scanner source now has independently reviewed ordinary-error finalization, failed-summary terminal-event parity, transactional progress-count/cache updates, cache-delete-only terminal fallback, directory rechecks, and bounded file replacement checks. A static backend/native/CLI audit closed the remaining manifest P0s by enabling Tokio net/time and declaring runtime walkdir; independent review found no remaining static P0/P1 in that slice. Compilation and runtime proof remain pending.

  - id: production-shell-and-routing
    work: Build the real dark application shell, routing, persisted collapsible sidebar, and main-top-bar Cmd-K foundation.
    status: claimed
    prerequisites:
      - backend-domain-foundation
    priority: 98
    created_at: 2026-07-15T05:45:00Z
    claim:
      owner: root
      started_at: 2026-07-15T11:27:00Z
    outcome: Static implementation now has real route/scan Cmd-K callbacks plus a persistent, collapsible, keyboard- and pointer-resizable sidebar. Browser/build proof remains a separate gate.

  - id: ui-runtime-contract-closure
    work: "Restore truthful production shell contracts: main-top-bar Cmd-K, dashboard live activity, Tasks stop wiring, real scan action availability, and one coherent cancellation policy across browser/native/backend."
    status: claimed
    prerequisites:
      - backend-domain-foundation
    priority: 98
    created_at: 2026-07-15T10:27:00Z
    claim:
      owner: root
      started_at: 2026-07-15T10:27:00Z
    outcome: Production Cmd-K now dispatches real route/location/scan/current-view callbacks, Tasks receives real Stop wiring, unsupported controls are truthful rather than fake RPCs, Dashboard receives activity props, and local-only cancellation is explicit. Static source closure is complete; runtime proof remains pending.

  - id: ui-source-horizon-closure
    work: "Close mixed-horizon UI source defects without weakening tests: real shared exports, File tree/hierarchy behavior, matching shell/grid classes, redesign preview route registration, and every remaining source-only UI regression."
    status: succeeded
    prerequisites:
      - structured-source-recovery
    priority: 100
    created_at: 2026-07-15T10:45:00Z
    outcome: Static export P0s, exact prototype/routing recovery, directory-only File tree behavior, shell/grid class coverage, and preview build entry are repaired. The full source-only UI suite now passes 138/138 using the bundled Node runtime. Repaired behavior includes authoritative event-lag recovery, stale-result invalidation, immediate real stop acknowledgement, sidebar-only scan selection, scan-scoped folder browsing, a flat truthful Search workspace, and fixture-backed component preview routes. Assertions were re-baselined only for retired/fake contracts (unsupported file-extra-info cancellation, obsolete scan metadata RPC, abandoned hierarchy props), with product-specific evidence. Runtime/build validation remains with reproducible-build-inputs and browser/native acceptance tasks.

  - id: scan-workspace-and-directory-navigation
    work: Build the scan-relative Files/File tree workspace, directory-only side navigation, file table, inspector, and safe actions.
    status: claimed
    prerequisites:
      - production-shell-and-routing
    priority: 98
    created_at: 2026-07-15T05:45:00Z
    claim:
      owner: root
      started_at: 2026-07-15T11:05:00Z
    outcome: Production File tree is now real paged directory-only navigation beside the file workspace. Remaining work is compile/runtime/browser proof and any audit findings, not a completion claim.

  - id: scan-exclude-filter-contract
    work: Implement persistent non-destructive per-scan excludes across every scan-scoped query/action with database/source integrity tests.
    status: open
    prerequisites:
      - scan-workspace-and-directory-navigation
    priority: 99
    created_at: 2026-07-15T05:45:00Z

  - id: duplicates-tasks-search-options
    work: Build real Duplicates, Tasks, Search, and Options workflows on shared shell/state/transport primitives.
    status: open
    prerequisites:
