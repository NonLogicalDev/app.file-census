tasks:
  - id: rebuild-requirements-ledger
    work: Recreate durable product requirements, plans, AGENTS guidance, and a clean acceptance ledger with no inherited implementation claims.
    status: succeeded
    prerequisites: []
    priority: 100
    created_at: 2026-07-15T05:45:00Z
    outcome: Clean rebuild requirements and durable coordination files exist.
    evidence:
      - docs: AGENTS.md, GOALS.md, plan-065, plan-066, workqueue.yaml

  - id: visual-reference-recovery
    work: Recover or re-supply the deleted visual reference and approved prototype screenshots before any visual parity or final-acceptance claim.
    status: open
    prerequisites:
      - rebuild-requirements-ledger
    priority: 100
    created_at: 2026-07-15T05:45:00Z
    routing:
      assigned_to: user
    resources:
      - user-reference-asset

  - id: structured-source-recovery
    work: Extract the pre-deletion historical patch ledger, deduplicate copied calls, replay only exact context matches into a temporary tree, and promote only validated source into this checkout.
    status: succeeded
    prerequisites:
      - rebuild-requirements-ledger
    priority: 100
    created_at: 2026-07-15T05:55:00Z
    resources:
      - session-logs
    outcome: Direct-event manifest plus a hash-verified source index are complete. Path-scoped recovery gates every patch on direct success output; complete-read seeds now validate strict multi-line overlaps. A final-architecture baseline is promoted with static import/module checks, a latest clean dark global-style horizon through 2026-07-12, a June 14 App source whose 47-file import closure resolves, a 1,385-line scanner horizon, and exact root flake/ignore blobs. The strict replay boundary documented incompatible database/CLI horizons rather than fabricating them; their intentional reconstruction belongs to downstream domain work. The historical plan archive contains 41 exact-replayed, hash-verified files and records 25 non-fabricated omissions. Static UI imports close, but missing toolchains/lockfiles and UI dist keep runtime validation blocked.

  - id: native-bundle-icon-assets
    work: Recover the configured macOS native bundle icon assets from an approved installed File Census bundle, without changing that installed application.
    status: succeeded
    prerequisites:
      - rebuild-requirements-ledger
    priority: 97
    created_at: 2026-07-15T08:38:00Z
    outcome: Exact ICNS and configured PNG sizes are present under src/native_app/icons; no installed-app files were modified.
    evidence:
      - source: /Applications/file-census.app/Contents/Resources/icon.icns
      - sha256: 32d3f29f5a3e39595149ff50172db18a53e866ab8d6a83be480be4e5514fdd6e
      - config: src/native_app/tauri.conf.json

  - id: reproducible-build-inputs
    work: Establish approved, canonical Nix/npm/Cargo inputs and bounded artifact paths before the first end-to-end build proof.
    status: open
    prerequisites:
      - structured-source-recovery
      - native-bundle-icon-assets
    priority: 96
    created_at: 2026-07-15T08:45:00Z
    outcome: Exact PostCSS and Tailwind source configs are restored. The remaining gate is an empty ui/dist, an incomplete ignored ui/node_modules store with no executable Vite links, no canonical frontend lockfile, no flake.lock, no ambient Node/Rust toolchain, and an external untracked Cargo.lock. This work needs explicit approval before network or high-disk writes.
    resources:
      - user-approval-for-network-and-build-artifacts

  - id: backend-domain-foundation
    work: Build the Rust/SQLite domain and JSON-RPC/browser-server foundation for locations, scans, files, scan visibility, and live progress.
    status: claimed
    prerequisites:
      - rebuild-requirements-ledger
      - structured-source-recovery
    priority: 99
    created_at: 2026-07-15T05:45:00Z
    claim:
      owner: root
      started_at: 2026-07-15T08:41:00Z
    outcome: The database now supplies snapshot-scoped tree/search/occurrence pages, protected visible deletion, duplicate-cache status, update-scan seed/create support, and a legacy-safe Unknown location-kind migration. Browser/native details use visible media sources and WebSocket lag is recoverable. Remaining work is compile proof plus real scanner controls/dashboard/shell contracts, not an implied runtime success.

  - id: production-shell-and-routing
    work: Build the real dark application shell, routing, persisted collapsible sidebar, and main-top-bar Cmd-K foundation.
    status: claimed
    prerequisites:
      - backend-domain-foundation
    priority: 98
    created_at: 2026-07-15T05:45:00Z
    claim:
      owner: root
      started_at: 2026-07-15T11:27:00Z
    outcome: Static implementation now has real route/scan Cmd-K callbacks plus a persistent, collapsible, keyboard- and pointer-resizable sidebar. Browser/build proof remains a separate gate.

  - id: ui-runtime-contract-closure
    work: "Restore truthful production shell contracts: main-top-bar Cmd-K, dashboard live activity, Tasks stop wiring, real scan action availability, and one coherent cancellation policy across browser/native/backend."
    status: claimed
    prerequisites:
      - backend-domain-foundation
    priority: 98
    created_at: 2026-07-15T10:27:00Z
    claim:
      owner: root
      started_at: 2026-07-15T10:27:00Z
    outcome: Production Cmd-K now dispatches real route/location/scan/current-view callbacks, Tasks receives real Stop wiring, unsupported controls are truthful rather than fake RPCs, Dashboard receives activity props, and local-only cancellation is explicit. Static source closure is complete; runtime proof remains pending.

  - id: ui-source-horizon-closure
    work: "Close mixed-horizon UI source defects without weakening tests: real shared exports, File tree/hierarchy behavior, matching shell/grid classes, and redesign preview route registration."
    status: succeeded
    prerequisites:
      - structured-source-recovery
    priority: 100
    created_at: 2026-07-15T10:45:00Z
    outcome: Static export P0s, exact prototype/routing recovery, directory-only File tree behavior, shell/grid class coverage, preview build entry, and stale search-filter test closure are repaired. Runtime/build validation belongs to reproducible-build-inputs and browser/native acceptance tasks.

  - id: scan-workspace-and-directory-navigation
    work: Build the scan-relative Files/File tree workspace, directory-only side navigation, file table, inspector, and safe actions.
    status: claimed
    prerequisites:
      - production-shell-and-routing
    priority: 98
    created_at: 2026-07-15T05:45:00Z
    claim:
      owner: root
      started_at: 2026-07-15T11:05:00Z
    outcome: Production File tree is now real paged directory-only navigation beside the file workspace. Remaining work is compile/runtime/browser proof and any audit findings, not a completion claim.

  - id: scan-exclude-filter-contract
    work: Implement persistent non-destructive per-scan excludes across every scan-scoped query/action with database/source integrity tests.
    status: open
    prerequisites:
      - scan-workspace-and-directory-navigation
    priority: 99
    created_at: 2026-07-15T05:45:00Z

  - id: duplicates-tasks-search-options
    work: Build real Duplicates, Tasks, Search, and Options workflows on shared shell/state/transport primitives.
    status: open
    prerequisites:
      - production-shell-and-routing
    priority: 94
    created_at: 2026-07-15T05:45:00Z

  - id: cli-scan-bootstrap
    work: Implement and prove compatible CLI scan bootstrap with canonical source validation, atomic location/scan creation, UTC date-based IDs, collisions, and legacy behavior.
    status: claimed
    prerequisites:
      - backend-domain-foundation
    priority: 88
    created_at: 2026-07-15T05:45:00Z
    claim:
      owner: root
      started_at: 2026-07-15T11:18:00Z
    outcome: Static implementation now canonicalizes the source, creates only a compatible Unknown location, uses the real scanner lifecycle, reserves UTC date IDs atomically with deterministic collisions, and preserves legacy CLI forms. Toolchain-backed integration proof remains pending.

  - id: scanner-progress-tui
    work: Implement and prove opt-in Ratatui progress with bounded active-operation telemetry, truthful queue/pool bars, duration ordering, terminal restoration, and non-TTY fallback.
    status: claimed
    prerequisites:
      - backend-domain-foundation
    priority: 86
    created_at: 2026-07-15T05:45:00Z
    claim:
      owner: root
      started_at: 2026-07-15T11:27:00Z
    outcome: Bounded authoritative active-operation telemetry is now present in source with stable oldest-first projection and cleanup coverage. The Ratatui/Crossterm dependency, renderer, and terminal acceptance remain intentionally unstarted until approved reproducible inputs are available.

  - id: scanner-containment-atomicity
    work: "Eliminate or explicitly constrain the remaining scanner P2s: post-discovery filesystem replacement races and update-scan setup orphan records. Use a durable, reviewed design; do not claim final quality while either remains unresolved."
    status: open
    prerequisites:
      - backend-domain-foundation
    priority: 85
    created_at: 2026-07-15T09:27:00Z
    outcome: Static root containment is complete. Portable no-follow descriptor traversal needs an explicit design decision, while update-scan setup should use a short atomic database seed transaction.

  - id: browser-native-accessibility-matrix
