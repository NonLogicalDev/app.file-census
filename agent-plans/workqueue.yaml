    status: open
    prerequisites:
      - scan-exclude-filter-contract
      - duplicates-tasks-search-options
      - native-bundle-icon-assets
      - reproducible-build-inputs
      - scanner-containment-atomicity
    priority: 80
    outcome: In-app browser connectivity is available, but the current enterprise policy blocks the local preview origin. Do not substitute Chrome; browser evidence remains pending permitted local access and reproducible build inputs.
    created_at: 2026-07-15T05:45:00Z

